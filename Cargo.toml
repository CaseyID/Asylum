[workspace]
members = [
    "crates/asylum-types",
    "crates/asylum-daemon",
    "crates/asylum-cli",
    "crates/asylum",
    "xtask",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.3.0"

[workspace.dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "macros", "query"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "5"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
rust-embed = "8" # Used to embed cockpit/dist for release binary asset serving
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing", "serde"] }
rand = "0.9"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "signal", "sync", "time", "fs", "io-util"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
serde_with = "3"
futures = "0.3"
libc = "0.2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1"

[workspace.lints.clippy]
denial = "warn"
